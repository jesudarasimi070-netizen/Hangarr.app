```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HANGARR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #070708;
      color: #F4F4F2;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      background: rgba(28, 28, 30, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }
    .gold-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #FFF3B0, #D4AF37, #AA7C11);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .sub {
      color: #8E8E93;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .pts {
      font-size: 42px;
      font-weight: 800;
      color: #D4AF37;
      margin: 16px 0;
      font-variant-numeric: tabular-nums;
    }
    .coin {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2C2C2E, #070708);
      border: 2px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      display: grid;
      place-items: center;
      font-size: 48px;
      color: #D4AF37;
      margin: 0 auto 24px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .coin:active, .btn:active {
      transform: scale(0.92);
    }
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #F3D977, #D4AF37, #AA7C11);
      color: #070708;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="gold-title">HANGARR</div>
    <div class="sub">Central Creator Hub</div>

    <div class="pts" id="score">1,000</div>
    <div class="coin" id="coin"><i class="fa-solid fa-bolt"></i></div>

    <button class="btn" id="claimBtn">Sync & Save</button>
  </div>

  <script>
    let points = Number(localStorage.getItem('pts')) || 1000;
    const scoreEl = document.getElementById('score');

    function render() {
      scoreEl.textContent = points.toLocaleString();
      localStorage.setItem('pts', points);
    }

    document.getElementById('coin').addEventListener('pointerdown', () => {
      points += 1;
      if (navigator.vibrate) navigator.vibrate(10);
      render();
    });

    document.getElementById('claimBtn').addEventListener('click', () => {
      alert(`Progress saved: ${points.toLocaleString()} points.`);
    });

    render();
  </script>
</body>
</html>
