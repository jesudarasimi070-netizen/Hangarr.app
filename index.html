<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HANGARR | All Your Socials. One Central Hub.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --obsidian: #070708;
      --panel: rgba(22, 22, 28, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --gold: #D4AF37;
      --gold-light: #F3E5AB;
      --text: #F4F4F2;
      --muted: #A0A0A9;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      background: var(--obsidian);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--panel);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.85);
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFF3B0, #D4AF37, #AA7C11);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      color: #070708;
      background: linear-gradient(135deg, #F3D977, #D4AF37, #B8891A);
      border: none;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HANGARR</h1>
    <p>All your socials. One central hub. The interface is online and ready for deployment.</p>
    <button class="btn" onclick="alert('System operational.')">
      <i class="fa-solid fa-bolt"></i> Launch App
    </button>
  </div>
</body>
</html>
